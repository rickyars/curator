<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Image Elo Rater</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      color: #ccc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 40px 48px;
      text-align: center;
      max-width: 360px;
    }
    h1 { font-size: 48px; font-weight: 700; color: #333; margin-bottom: 8px; }
    h2 { font-size: 16px; font-weight: 400; color: #888; margin-bottom: 20px; }
    p { font-size: 14px; color: #555; margin-bottom: 28px; line-height: 1.5; }
    a {
      display: inline-block;
      padding: 7px 18px;
      border-radius: 6px;
      border: 1px solid #2a5a2a;
      background: #1a3a1a;
      color: #6acc6a;
      font-size: 13px;
      text-decoration: none;
    }
    a:hover { background: #1f481f; }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">Go home</a>
  </div>
</body>
</html>
