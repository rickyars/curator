<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Elo Rater</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Loading view -->
<div id="loading-view">
  <div style="text-align:center;color:#555;font-size:14px;">Connecting…</div>
</div>

<!-- Rating view -->
<div id="rating-view">
  <div class="images-row">
    <div class="image-panel" id="panel-a"><img id="img-a" src="" alt=""><button class="flag-btn" id="flag-a" title="Remove from tournament">🗑️</button></div>
    <div class="image-divider"></div>
    <div class="image-panel" id="panel-b"><img id="img-b" src="" alt=""><button class="flag-btn" id="flag-b" title="Remove from tournament">🗑️</button></div>
  </div>
  <div class="stats-bar">
    <span id="stats-session"></span>
    <span style="color:#2a2a2a;">← → to pick · click to pick</span>
    <span id="stats-progress"></span>
  </div>
</div>

<!-- Results view -->
<div id="results-view">
  <div class="results-grid" id="results-grid"></div>
</div>

<!-- Removed view -->
<div id="removed-view">
  <div class="removed-empty" id="removed-empty" style="display:none;">No images removed</div>
  <div class="results-grid" id="removed-grid"></div>
</div>

<!-- Fixed corner controls (always visible once a folder is loaded) -->
<div id="corner-controls" style="display:none;">
  <button class="btn" id="results-toggle-btn">Results</button>
  <button class="btn" id="removed-toggle-btn">Removed</button>
  <button class="btn" id="export-btn">Export CSV</button>
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, update, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import FIREBASE_CONFIG from './firebase-config.js';

// --- CONFIG ---
const K_HIGH = 32;
const K_LOW  = 16;
const K_THRESHOLD = 10;
const LOW_GAME_CAP = 15;
const PROGRESS_THRESHOLD = 5;

// Firebase keys can't contain . / # $ [ ]  — encode/decode for storage
function toFirebaseKey(name) {
  return name.replace(/\./g, '__dot__').replace(/\//g, '__sl__')
             .replace(/#/g, '__hash__').replace(/\$/g, '__dol__')
             .replace(/\[/g, '__lb__').replace(/\]/g, '__rb__');
}
function fromFirebaseKey(key) {
  return key.replace(/__dot__/g, '.').replace(/__sl__/g, '/')
            .replace(/__hash__/g, '#').replace(/__dol__/g, '$')
            .replace(/__lb__/g, '[').replace(/__rb__/g, ']');
}

// --- GLOBALS ---
const app = initializeApp(FIREBASE_CONFIG);
const db  = getDatabase(app);
let localScores        = {};   // in-memory cache of Firebase images data
let sessionComparisons = 0;
let lastPair           = null;
let totalComparisons   = 0;    // kept in sync by onValue listener
let resultsUnsubscribe = null; // detaches onValue when results view closes
let picking = false;           // prevents double-votes during Firebase round-trip
let manifestSet = new Set();   // set of valid filenames from images.json
let nextPair = null;           // preselected + prefetched upcoming pair

function imageURL(name) {
  return 'images/' + name.split('/').map(encodeURIComponent).join('/');
}

// --- ELO ---
function expectedScore(scoreA, scoreB) {
  return 1 / (1 + Math.pow(10, (scoreB - scoreA) / 400));
}

// --- PAIRING ---
function weightedRandom(items) {
  const total = items.reduce((sum, x) => sum + x.weight, 0);
  let r = Math.random() * total;
  for (const item of items) {
    r -= item.weight;
    if (r <= 0) return item.name;
  }
  return items[items.length - 1].name;
}

function selectNextPair(images, lastPair) {
  const names = Object.keys(images);
  const weights = names.map(n => ({ name: n, weight: 1 / (images[n].games + 1) }));
  const freshWeights = lastPair && names.length > 3
    ? weights.filter(w => !lastPair.includes(w.name))
    : weights;
  let playerA = weightedRandom(freshWeights.length ? freshWeights : weights);

  const pickB = (excludeA) => {
    const others = names.filter(n => n !== excludeA);
    // Prefer images not shown in the last pair
    const fresh = lastPair ? others.filter(n => !lastPair.includes(n)) : others;
    const source = fresh.length >= 1 ? fresh : others;
    let pool = source.filter(n => images[n].games < LOW_GAME_CAP);
    if (pool.length === 0) pool = source;
    pool.sort((a, b) =>
      Math.abs(images[a].score - images[excludeA].score) -
      Math.abs(images[b].score - images[excludeA].score)
    );
    return pool;
  };

  let bCandidates = pickB(playerA);
  const topN = bCandidates.slice(0, Math.min(3, bCandidates.length));
  let playerB = topN[Math.floor(Math.random() * topN.length)];

  if (lastPair && names.length > 2) {
    const [la, lb] = lastPair;
    const isRepeat = (playerA === la && playerB === lb) ||
                     (playerA === lb && playerB === la);
    if (isRepeat) {
      if (bCandidates.length > 1) {
        playerB = bCandidates[1];
      } else {
        const altWeights = weights.filter(w => w.name !== playerA);
        playerA = weightedRandom(altWeights);
        const altTop = pickB(playerA).slice(0, 3);
        playerB = altTop[Math.floor(Math.random() * altTop.length)];
      }
    }
  }
  return [playerA, playerB];
}

// --- UI ---
function showLoadingStatus(msg) {
  const view = document.getElementById('loading-view');
  view.innerHTML = '<div style="text-align:center;color:#555;font-size:14px;"></div>';
  view.firstChild.textContent = msg;
}

function lowGameCount(images) {
  return Object.values(images).filter(img => img.games < PROGRESS_THRESHOLD).length;
}

function ratableImages() {
  return Object.fromEntries(Object.entries(localScores).filter(([, v]) => !v.flagged));
}

function flaggedImages() {
  return Object.entries(localScores).filter(([, v]) => v.flagged);
}

function showRatingView(nameA, nameB) {
  document.getElementById('loading-view').style.display  = 'none';
  document.getElementById('results-view').style.display  = 'none';
  document.getElementById('removed-view').style.display  = 'none';
  document.getElementById('rating-view').style.display   = 'flex';
  document.getElementById('corner-controls').style.display = 'flex';
  document.getElementById('results-toggle-btn').textContent = 'Results';

  document.getElementById('img-a').src = imageURL(nameA);
  document.getElementById('img-b').src = imageURL(nameB);
  document.getElementById('panel-a').dataset.name = nameA;
  document.getElementById('panel-b').dataset.name = nameB;
  updateStats();
}

function showResultsView() {
  document.getElementById('loading-view').style.display  = 'none';
  document.getElementById('rating-view').style.display   = 'none';
  document.getElementById('removed-view').style.display  = 'none';
  document.getElementById('results-view').style.display  = 'flex';
  document.getElementById('results-toggle-btn').textContent = '← Rate';

  renderResultsGrid();

  // Live updates while results panel is open
  if (resultsUnsubscribe) { resultsUnsubscribe(); resultsUnsubscribe = null; }
  resultsUnsubscribe = onValue(ref(db, 'images'), snap => {
    const data = snap.val();
    if (data) {
      for (const key of manifestSet) {
        const fbKey = toFirebaseKey(key);
        if (data[fbKey]) localScores[key] = data[fbKey];
      }
      renderResultsGrid();
    }
  });
}

function renderResultsGrid() {
  const sorted = Object.entries(ratableImages())
    .sort((a, b) => b[1].score - a[1].score);

  const grid = document.getElementById('results-grid');
  grid.innerHTML = '';
  sorted.forEach(([name, record], i) => {
    const rank = i + 1;
    const cell = document.createElement('div');
    cell.className = 'thumb-cell';
    const thumb = document.createElement('img');
    thumb.src = imageURL(name);
    thumb.alt = '';
    const rankEl = document.createElement('div');
    rankEl.className = 'thumb-rank' + (rank <= 3 ? ' top3' : '');
    rankEl.textContent = `#${rank}`;
    const scoreEl = document.createElement('div');
    scoreEl.className = 'thumb-score';
    scoreEl.textContent = Math.round(record.score);
    cell.append(thumb, rankEl, scoreEl);
    grid.appendChild(cell);
  });
}

function updateStats() {
  const low = lowGameCount(ratableImages());
  document.getElementById('stats-session').textContent =
    `${sessionComparisons} comparison${sessionComparisons === 1 ? '' : 's'} this session · ${totalComparisons} total`;
  document.getElementById('stats-progress').textContent =
    low > 0
      ? `${low} image${low === 1 ? '' : 's'} with fewer than ${PROGRESS_THRESHOLD} comparisons`
      : 'Refining rankings';
  updateRemovedBadge();
}

function updateRemovedBadge() {
  const n = flaggedImages().length;
  document.getElementById('removed-toggle-btn').textContent = n > 0 ? `Removed (${n})` : 'Removed';
}

function showRemovedView() {
  document.getElementById('loading-view').style.display  = 'none';
  document.getElementById('rating-view').style.display   = 'none';
  document.getElementById('results-view').style.display  = 'none';
  document.getElementById('removed-view').style.display  = 'flex';
  document.getElementById('results-toggle-btn').textContent = 'Results';

  const entries = flaggedImages().sort((a, b) => a[0].localeCompare(b[0]));
  const grid = document.getElementById('removed-grid');
  grid.innerHTML = '';
  document.getElementById('removed-empty').style.display = entries.length === 0 ? 'flex' : 'none';

  entries.forEach(([name]) => {
    const cell = document.createElement('div');
    cell.className = 'thumb-cell';
    const img = document.createElement('img');
    img.src = imageURL(name);
    img.alt = '';
    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'restore-btn';
    restoreBtn.textContent = 'Restore';
    restoreBtn.onclick = () => unflagImage(name);
    cell.append(img, restoreBtn);
    grid.appendChild(cell);
  });
}

function exportCSV() {
  const rows = Object.entries(localScores)
    .filter(([, img]) => img.games > 0)
    .sort((a, b) => b[1].score - a[1].score)
    .map(([name, img]) =>
      [name, img.score.toFixed(2), img.wins, img.losses, img.games].join(',')
    );
  const csv = ['filename,score,wins,losses,games', ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'elo-rankings.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// --- EVENTS ---
// Single transaction over the whole images node: both Elo updates commit
// atomically and always use fresh server-side scores (no stale opponent).
async function applyResultFirebase(winnerName, loserName) {
  const winKey  = toFirebaseKey(winnerName);
  const loseKey = toFirebaseKey(loserName);

  const result = await runTransaction(ref(db, 'images'), current => {
    // First attempt may run against a null local cache; seed it from our
    // in-memory copy — the server rejects and retries with real data if stale.
    const images = current !== null
      ? current
      : Object.fromEntries(Object.entries(localScores).map(([n, v]) => [toFirebaseKey(n), v]));
    const w = images[winKey];
    const l = images[loseKey];
    if (!w || !l) return;  // abort: entries missing server-side

    const kWinner = w.games < K_THRESHOLD ? K_HIGH : K_LOW;
    const kLoser  = l.games < K_THRESHOLD ? K_HIGH : K_LOW;
    const exp = expectedScore(w.score, l.score);
    images[winKey] = {
      ...w,
      score:  w.score + kWinner * (1 - exp),
      wins:   w.wins + 1,
      losses: w.losses,
      games:  w.games + 1,
    };
    images[loseKey] = {
      ...l,
      score:  l.score - kLoser * (1 - exp),
      wins:   l.wins,
      losses: l.losses + 1,
      games:  l.games + 1,
    };
    return images;
  });

  if (result.committed) {
    const data = result.snapshot.val() || {};
    for (const name of manifestSet) {
      const val = data[toFirebaseKey(name)];
      if (val) localScores[name] = val;
    }
  }

  runTransaction(ref(db, 'totalComparisons'), n => (n || 0) + 1).catch(() => {});
}

// Pick the upcoming pair while the user is still deciding the current one,
// and start the image downloads so the next round appears instantly.
function preloadNextPair(currentPair) {
  nextPair = selectNextPair(ratableImages(), currentPair);
  for (const name of nextPair) {
    const img = new Image();
    img.src = imageURL(name);
  }
}

async function onPick(winnerName, loserName) {
  if (picking) return;
  picking = true;
  try {
    await applyResultFirebase(winnerName, loserName);
    sessionComparisons++;
    const pair = nextPair && !nextPair.some(n => localScores[n].flagged)
      ? nextPair
      : selectNextPair(ratableImages(), lastPair);
    lastPair = pair;
    showRatingView(pair[0], pair[1]);
    preloadNextPair(pair);
  } catch (e) {
    showLoadingStatus(`Error saving vote: ${e.message}. Reload to reconnect.`);
  } finally {
    picking = false;
  }
}

function startRating() {
  const pool = ratableImages();
  if (Object.keys(pool).length < 2) {
    showLoadingStatus('Fewer than 2 non-removed images remain. Restore some from Removed.');
    return;
  }
  const pair = selectNextPair(pool, lastPair);
  lastPair = pair;
  showRatingView(pair[0], pair[1]);
  preloadNextPair(pair);
}

// --- FLAGGING ---
async function setFlag(name, flagged) {
  const key = ref(db, `images/${toFirebaseKey(name)}`);
  const result = await runTransaction(key, current => {
    if (current === null) return current;
    current.flagged = flagged;
    return current;
  });
  if (result.committed && result.snapshot.val()) {
    localScores[name] = result.snapshot.val();
  } else {
    localScores[name].flagged = flagged; // best-effort local fallback
  }
}

async function flagImage(name) {
  try {
    await setFlag(name, true);
  } catch (e) {
    showLoadingStatus(`Error flagging image: ${e.message}`);
    return;
  }
  updateRemovedBadge();
  startRating();
}

async function unflagImage(name) {
  try {
    await setFlag(name, false);
  } catch (e) {
    showLoadingStatus(`Error restoring image: ${e.message}`);
    return;
  }
  updateRemovedBadge();
  if (document.getElementById('removed-view').style.display !== 'none') {
    showRemovedView();
  }
}

document.getElementById('panel-a').addEventListener('click', () => {
  const a = document.getElementById('panel-a').dataset.name;
  const b = document.getElementById('panel-b').dataset.name;
  if (a && b) onPick(a, b);
});

document.getElementById('panel-b').addEventListener('click', () => {
  const a = document.getElementById('panel-a').dataset.name;
  const b = document.getElementById('panel-b').dataset.name;
  if (a && b) onPick(b, a);
});

document.addEventListener('keydown', e => {
  if (document.getElementById('rating-view').style.display === 'none') return;
  const a = document.getElementById('panel-a').dataset.name;
  const b = document.getElementById('panel-b').dataset.name;
  if (!a || !b) return;
  if (e.key === 'ArrowLeft')  onPick(a, b);
  if (e.key === 'ArrowRight') onPick(b, a);
});

document.getElementById('results-toggle-btn').addEventListener('click', () => {
  if (document.getElementById('results-view').style.display === 'none') {
    showResultsView();
  } else {
    if (resultsUnsubscribe) { resultsUnsubscribe(); resultsUnsubscribe = null; }
    showRatingView(
      document.getElementById('panel-a').dataset.name,
      document.getElementById('panel-b').dataset.name
    );
  }
});

document.getElementById('flag-a').addEventListener('click', e => {
  e.stopPropagation();
  const a = document.getElementById('panel-a').dataset.name;
  if (a) flagImage(a);
});

document.getElementById('flag-b').addEventListener('click', e => {
  e.stopPropagation();
  const b = document.getElementById('panel-b').dataset.name;
  if (b) flagImage(b);
});

document.getElementById('removed-toggle-btn').addEventListener('click', () => {
  if (document.getElementById('removed-view').style.display === 'none') {
    if (resultsUnsubscribe) { resultsUnsubscribe(); resultsUnsubscribe = null; }
    showRemovedView();
  } else {
    startRating();
  }
});

document.getElementById('export-btn').addEventListener('click', exportCSV);

// --- INIT ---
async function init() {
  showLoadingStatus('Connecting…');

  // 1. Fetch images.json
  let filenames;
  try {
    const res = await fetch('images.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    filenames = await res.json();
  } catch (e) {
    showLoadingStatus(`Error: could not load images.json (${e.message})`);
    return;
  }

  if (filenames.length < 2) {
    showLoadingStatus('Error: add at least 2 images to the images/ folder and re-run generate-manifest.js');
    return;
  }

  // 2. Read current Firebase scores
  let firebaseImages = {};
  try {
    const snap = await get(ref(db, 'images'));
    const raw = snap.val() || {};
    // Decode Firebase keys back to original filenames
    for (const [key, val] of Object.entries(raw)) {
      firebaseImages[fromFirebaseKey(key)] = val;
    }
  } catch (e) {
    showLoadingStatus(`Error: could not connect to Firebase (${e.message}). Check FIREBASE_CONFIG.`);
    return;
  }

  manifestSet = new Set(filenames);

  // 3. Build localScores — only images in the manifest (Firebase keeps scores
  //    for removed images, but they must not show up in pairing or results)
  localScores = {};
  const missing = {};
  for (const name of filenames) {
    if (firebaseImages[name]) {
      localScores[name] = firebaseImages[name];
    } else {
      const entry = { score: 1000, wins: 0, losses: 0, games: 0, flagged: false };
      localScores[name] = entry;
      missing[toFirebaseKey(name)] = entry;  // encode key for Firebase
    }
  }
  if (Object.keys(missing).length > 0) {
    try {
      await update(ref(db, 'images'), missing);
    } catch (e) {
      showLoadingStatus(`Error initializing scores: ${e.message}. Check FIREBASE_CONFIG.`);
      return;
    }
  }

  // 4. Seed totalComparisons from Firebase
  let totalSnap;
  try {
    totalSnap = await get(ref(db, 'totalComparisons'));
  } catch (e) {
    showLoadingStatus(`Error reading totalComparisons: ${e.message}. Check FIREBASE_CONFIG.`);
    return;
  }
  totalComparisons = totalSnap.val() || 0;

  // 5. Keep totalComparisons in sync (always-on listener)
  onValue(ref(db, 'totalComparisons'), snap => {
    totalComparisons = snap.val() || 0;
    if (document.getElementById('rating-view').style.display !== 'none') {
      updateStats();
    }
  });

  // 6. Begin rating
  startRating();
}

init();
</script>
</body>
</html>
