<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Elo Rater</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: #0d0d0d;
  color: #ccc;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
}

/* ── Buttons ──────────────────────────────────────────────── */
.btn {
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid #333;
  background: #1e1e1e;
  color: #ccc;
  font-size: 12px;
  cursor: pointer;
}
.btn:hover { background: #2a2a2a; }
.btn-primary {
  background: #1a3a1a;
  border-color: #2a5a2a;
  color: #6acc6a;
}
.btn-primary:hover { background: #1f481f; }

/* ── Loading view ─────────────────────────────────────────── */
#loading-view {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.drop-zone {
  border: 2px dashed #333;
  border-radius: 12px;
  padding: 56px 72px;
  text-align: center;
  color: #555;
  cursor: pointer;
  transition: border-color .15s, color .15s;
}
.drop-zone:hover, .drop-zone.drag-over { border-color: #555; color: #888; }
.drop-zone .icon { font-size: 40px; margin-bottom: 12px; }
.drop-zone p { font-size: 14px; margin-bottom: 16px; }

.resume-card {
  background: #161616;
  border: 1px solid #2a2a2a;
  border-radius: 10px;
  padding: 32px 40px;
  text-align: center;
  min-width: 320px;
}
.resume-card h2 { font-size: 17px; color: #ddd; margin-bottom: 6px; }
.resume-meta { font-size: 12px; color: #666; line-height: 1.7; }
.resume-btns { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }

.loading-error {
  margin-top: 14px;
  font-size: 12px;
  color: #c44;
  display: none;
  text-align: center;
}

/* ── Rating view ──────────────────────────────────────────── */
#rating-view {
  height: 100vh;
  display: none;
  flex-direction: column;
}

.images-row {
  flex: 1;
  display: flex;
  min-height: 0;
}

.image-panel {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: #0a0a0a;
  overflow: hidden;
  position: relative;
}
.image-panel::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 3px solid transparent;
  pointer-events: none;
  transition: border-color .1s;
}
.image-panel:hover::after { border-color: rgba(74,158,255,0.4); }

.image-panel img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
}

.image-divider { width: 3px; background: #0d0d0d; flex-shrink: 0; }

.stats-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 16px;
  background: #111;
  border-top: 1px solid #1e1e1e;
  flex-shrink: 0;
}
.stats-bar span { font-size: 11px; color: #444; }

/* ── Results view ─────────────────────────────────────────── */
#results-view {
  height: 100vh;
  display: none;
  flex-direction: column;
  overflow: hidden;
}

.results-grid {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 8px;
  align-content: start;
}

.thumb-cell {
  position: relative;
  aspect-ratio: 1;
  border-radius: 4px;
  overflow: hidden;
  background: #111;
}
.thumb-cell img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.thumb-rank {
  position: absolute;
  top: 5px;
  left: 5px;
  background: rgba(0,0,0,0.75);
  color: #ccc;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 5px;
  border-radius: 3px;
  line-height: 1.4;
}
.thumb-rank.top3 { color: #f0c040; }
.thumb-score {
  position: absolute;
  bottom: 5px;
  right: 5px;
  background: rgba(0,0,0,0.75);
  color: #aaa;
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 3px;
  line-height: 1.4;
}

/* ── Fixed corner controls ────────────────────────────────── */
#corner-controls {
  position: fixed;
  top: 12px;
  right: 14px;
  z-index: 100;
  display: flex;
  gap: 6px;
}

/* ── Storage warning banner ───────────────────────────────── */
#storage-warning {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  background: #3a1a1a;
  border: 1px solid #7a3a3a;
  color: #e8a0a0;
  font-size: 12px;
  padding: 8px 16px;
  border-radius: 6px;
  display: none;
  z-index: 200;
  cursor: pointer;
}
</style>
</head>
<body>

<!-- Loading view -->
<div id="loading-view"></div>

<!-- Rating view -->
<div id="rating-view">
  <div class="images-row">
    <div class="image-panel" id="panel-a"><img id="img-a" src="" alt=""></div>
    <div class="image-divider"></div>
    <div class="image-panel" id="panel-b"><img id="img-b" src="" alt=""></div>
  </div>
  <div class="stats-bar">
    <span id="stats-session"></span>
    <span style="color:#2a2a2a;">← → to pick · click to pick</span>
    <span id="stats-progress"></span>
  </div>
</div>

<!-- Results view -->
<div id="results-view">
  <div class="results-grid" id="results-grid"></div>
</div>

<!-- Fixed corner controls (always visible once a folder is loaded) -->
<div id="corner-controls" style="display:none;">
  <button class="btn" id="results-toggle-btn">Results</button>
  <button class="btn" id="export-btn">Export CSV</button>
</div>

<!-- Storage warning -->
<div id="storage-warning">⚠ Could not save scores (storage full). Click to dismiss.</div>

<!-- Hidden file input (no accept — webkitdirectory ignores it) -->
<input type="file" id="folder-input" webkitdirectory multiple style="display:none">

<script>
// --- CONFIG ---
const STORAGE_KEY = 'elo-rater-data';
const K_HIGH = 32;
const K_LOW = 16;
const K_THRESHOLD = 10;
const LOW_GAME_CAP = 15;
const PROGRESS_THRESHOLD = 5;
const ACCEPTED_EXTS = new Set(['jpg', 'jpeg', 'png', 'gif', 'webp']);

// --- STORAGE ---
function emptyData() {
  return { images: {}, totalComparisons: 0, lastSession: null };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyData();
    const parsed = JSON.parse(raw);
    return {
      images: parsed.images || {},
      totalComparisons: parsed.totalComparisons || 0,
      lastSession: parsed.lastSession || null,
    };
  } catch {
    return emptyData();
  }
}

function saveData(data) {
  const payload = {
    images: data.images,
    totalComparisons: data.totalComparisons,
    lastSession: Date.now(),
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch {
    document.getElementById('storage-warning').style.display = 'block';
  }
}

function mergeFolder(data, filenames) {
  for (const name of filenames) {
    if (!data.images[name]) {
      data.images[name] = { score: 1000, wins: 0, losses: 0, games: 0 };
    }
  }
}

// --- ELO ---
function expectedScore(scoreA, scoreB) {
  return 1 / (1 + Math.pow(10, (scoreB - scoreA) / 400));
}

function applyResult(winnerName, loserName, data) {
  const winner = data.images[winnerName];
  const loser  = data.images[loserName];
  const k   = winner.games < K_THRESHOLD ? K_HIGH : K_LOW;
  const exp = expectedScore(winner.score, loser.score);
  winner.score += k * (1 - exp);
  loser.score  -= k * (1 - exp);
  winner.wins++;
  winner.games++;
  loser.losses++;
  loser.games++;
  data.totalComparisons++;
}

// --- PAIRING ---

// --- UI ---

// --- EVENTS ---

// --- INIT ---
</script>
</body>
</html>
