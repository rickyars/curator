<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Elo Rater</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Loading view -->
<div id="loading-view"></div>

<!-- Rating view -->
<div id="rating-view">
  <div class="images-row">
    <div class="image-panel" id="panel-a"><img id="img-a" src="" alt=""><div class="img-error" id="img-error-a" style="display:none;"></div><div class="img-name" id="img-name-a"></div><button class="star-btn" id="star-a" title="Favorite">☆</button><button class="flag-btn" id="flag-a" title="Remove from tournament">🗑️</button></div>
    <div class="image-divider"></div>
    <div class="image-panel" id="panel-b"><img id="img-b" src="" alt=""><div class="img-error" id="img-error-b" style="display:none;"></div><div class="img-name" id="img-name-b"></div><button class="star-btn" id="star-b" title="Favorite">☆</button><button class="flag-btn" id="flag-b" title="Remove from tournament">🗑️</button></div>
  </div>
  <div class="stats-bar">
    <span id="stats-session"></span>
    <span style="color:#2a2a2a;">← → to pick · click to pick</span>
    <span id="stats-progress"></span>
  </div>
</div>

<!-- Results view -->
<div id="results-view">
  <div class="results-toolbar">
    <button class="btn" id="results-jump-top-btn">&uarr; Top</button>
    <button class="btn" id="results-prev-btn">&larr; Prev</button>
    <span id="results-page-label"></span>
    <button class="btn" id="results-next-btn">Next &rarr;</button>
    <button class="btn" id="results-jump-bottom-btn">&darr; Bottom</button>
  </div>
  <div class="results-grid" id="results-grid"></div>
</div>

<!-- Removed view -->
<div id="removed-view">
  <div class="results-toolbar">
    <button class="btn" id="removed-prev-btn">&larr; Prev</button>
    <span id="removed-page-label"></span>
    <button class="btn" id="removed-next-btn">Next &rarr;</button>
  </div>
  <div class="removed-empty" id="removed-empty" style="display:none;">No images removed</div>
  <div class="results-grid" id="removed-grid"></div>
</div>

<!-- Favorites view -->
<div id="favorites-view">
  <div class="results-toolbar">
    <button class="btn" id="favorites-prev-btn">&larr; Prev</button>
    <span id="favorites-page-label"></span>
    <button class="btn" id="favorites-next-btn">Next &rarr;</button>
  </div>
  <div class="removed-empty" id="favorites-empty" style="display:none;">No favorites yet</div>
  <div class="results-grid" id="favorites-grid"></div>
</div>

<!-- Duplicates view -->
<div id="duplicates-view">
  <div class="results-toolbar">
    <button class="btn" id="dup-load-btn">Load Duplicate Report</button>
    <input type="file" id="dup-report-input" accept=".json,application/json" style="display:none">
    <button class="btn" id="dup-sort-btn">Sort: Largest first</button>
    <button class="btn" id="dup-prev-btn">&larr; Prev</button>
    <span id="dup-page-label"></span>
    <button class="btn" id="dup-next-btn">Next &rarr;</button>
    <span id="dup-error" style="color:#c44;"></span>
  </div>
  <div class="dup-empty" id="dup-empty" style="display:none;">
    No duplicate report loaded yet.<br>
    Run <code>find-near-duplicates.py</code> on your folder with <code>--out report.json</code>, then load it here.
  </div>
  <div class="dup-clusters" id="dup-clusters"></div>
</div>

<!-- Fixed corner controls (always visible once a folder is loaded) -->
<div id="corner-controls" style="display:none;">
  <button class="btn" id="results-toggle-btn">Results</button>
  <button class="btn" id="removed-toggle-btn">Removed</button>
  <button class="btn" id="favorites-toggle-btn">Favorites</button>
  <button class="btn" id="duplicates-toggle-btn">Duplicates</button>
  <button class="btn" id="export-btn">Export CSV</button>
  <button class="btn" id="switch-folder-btn">Switch Folder</button>
</div>

<!-- Lightbox: full-size preview when a results/removed thumbnail is clicked -->
<div id="lightbox">
  <button id="lightbox-close" title="Close">&times;</button>
  <button id="lightbox-prev" class="lightbox-nav-btn" title="Previous (←)">&#8249;</button>
  <button id="lightbox-next" class="lightbox-nav-btn" title="Next (→)">&#8250;</button>
  <img id="lightbox-img" src="" alt="">
  <div id="lightbox-name"></div>
</div>

<!-- Judging banner: shown while a mini-tournament within a duplicate cluster is running -->
<div id="judging-banner">
  Judging cluster · <span id="judging-count"></span>
  <button class="btn btn-primary" id="judging-done-btn">Done</button>
</div>

<!-- Cluster review: after judging, pick how many of the cluster to keep -->
<div id="cluster-review">
  <div class="cluster-review-panel">
    <h3 id="cluster-review-heading">Keep which of these?</h3>
    <div class="cluster-review-grid" id="cluster-review-grid"></div>
    <div class="cluster-review-actions">
      <button class="btn" id="cluster-review-cancel">Cancel</button>
      <button class="btn btn-primary" id="cluster-review-confirm">Confirm</button>
    </div>
  </div>
</div>

<!-- Storage warning -->
<div id="storage-warning">⚠ Could not save scores (storage full). Click to dismiss.</div>

<!-- Hidden file input (no accept — webkitdirectory ignores it) -->
<input type="file" id="folder-input" webkitdirectory multiple style="display:none">

<script src="pairing.js"></script>
<script>
// --- CONFIG ---
const STORAGE_KEY = 'elo-rater-data';
const ACCEPTED_EXTS = new Set(['jpg', 'jpeg', 'png', 'gif', 'webp']);

// --- STORAGE ---
function emptyData() {
  return { images: {}, totalComparisons: 0, lastSession: null, duplicateClusters: [] };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyData();
    const parsed = JSON.parse(raw);
    return {
      images: parsed.images || {},
      totalComparisons: parsed.totalComparisons || 0,
      lastSession: parsed.lastSession || null,
      duplicateClusters: parsed.duplicateClusters || [],
    };
  } catch {
    return emptyData();
  }
}

function saveData(data) {
  const payload = {
    images: data.images,
    totalComparisons: data.totalComparisons,
    lastSession: Date.now(),
    duplicateClusters: data.duplicateClusters || [],
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch {
    document.getElementById('storage-warning').style.display = 'block';
  }
}

function mergeFolder(data, filenames) {
  for (const name of filenames) {
    if (!data.images[name]) {
      data.images[name] = { score: 1000, wins: 0, losses: 0, games: 0, flagged: false, favorited: false };
    }
  }
}

// --- ELO --- (expectedScore, shuffle, weightedRandom, pickClosestElo,
// pickOneNear, selectNextPair now live in pairing.js, shared with index.html)
function applyResult(winnerName, loserName, data) {
  const winner = data.images[winnerName];
  const loser  = data.images[loserName];
  const kWinner = winner.games < K_THRESHOLD ? K_HIGH : K_LOW;
  const kLoser  = loser.games  < K_THRESHOLD ? K_HIGH : K_LOW;
  const exp = expectedScore(winner.score, loser.score);
  winner.score += kWinner * (1 - exp);
  loser.score  -= kLoser  * (1 - exp);
  winner.wins++;
  winner.games++;
  loser.losses++;
  loser.games++;
  data.totalComparisons++;
}

// --- UI ---
function relativeDate(ts) {
  if (!ts) return 'a while ago';
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return 'yesterday';
  return `${days} days ago`;
}

function lowGameCount(images) {
  return Object.values(images).filter(img => img.games < PROGRESS_THRESHOLD).length;
}

function loadedImages() {
  return Object.fromEntries(Object.entries(appData.images).filter(([, v]) => v.url));
}

function ratableImages() {
  return Object.fromEntries(Object.entries(loadedImages()).filter(([, v]) => !v.flagged));
}

function flaggedImages() {
  return Object.entries(loadedImages()).filter(([, v]) => v.flagged);
}

function favoritedImages() {
  return Object.entries(loadedImages()).filter(([, v]) => v.favorited);
}

function showLoadingView(data) {
  cancelJudgingIfActive();
  document.getElementById('rating-view').style.display   = 'none';
  document.getElementById('results-view').style.display  = 'none';
  document.getElementById('removed-view').style.display  = 'none';
  document.getElementById('favorites-view').style.display = 'none';
  document.getElementById('duplicates-view').style.display = 'none';
  document.getElementById('corner-controls').style.display = 'none';
  const view = document.getElementById('loading-view');
  view.style.display = 'flex';

  const hasData = Object.keys(data.images).length > 0;
  const count = Object.keys(data.images).length;
  const statusLine = hasData
    ? `<div style="margin-top:10px;font-size:11px;color:#555;">${count} image${count === 1 ? '' : 's'} ranked so far &middot; last session ${relativeDate(data.lastSession)}</div>`
    : '';
  const resetBtn = hasData
    ? `<button class="btn btn-danger" id="reset-data-btn" style="margin-top:12px;">Reset data</button>`
    : '';

  view.innerHTML = `
    <div>
      <div class="drop-zone" id="drop-zone">
        <div class="icon">📁</div>
        <p>Drop a folder here, or click to choose one</p>
        <button class="btn" id="choose-btn">Choose folder</button>
        <div style="margin-top:10px;font-size:11px;color:#444;">Accepts jpg, jpeg, png, gif, webp</div>
        ${statusLine}
      </div>
      ${resetBtn}
      <div class="loading-error" id="loading-error"></div>
    </div>`;
  wireLoadingEvents();
}

function resetData() {
  const ok = confirm('Reset all local data? This permanently deletes every score, win/loss record, and flag for every image, across every folder you\'ve rated. This cannot be undone.');
  if (!ok) return;
  localStorage.removeItem(STORAGE_KEY);
  appData = emptyData();
  loadedFiles = new Map();
  showLoadingView(appData);
}

function showLoadingError(msg) {
  const el = document.getElementById('loading-error');
  if (!el) return;
  el.textContent = msg;
  el.style.display = 'block';
}

// Some images (very large dimensions/file size) fail to decode as a plain
// <img>. If that happens, retry via createImageBitmap with a resize request,
// which can succeed where direct decoding doesn't, and cache the downscaled
// preview so future pairings involving this image don't re-pay the cost.
async function downscalePreview(name) {
  const file = loadedFiles.get(name);
  if (!file) return null;
  try {
    const bitmap = await createImageBitmap(file, { resizeWidth: 2000, resizeQuality: 'medium' });
    const canvas = document.createElement('canvas');
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    canvas.getContext('2d').drawImage(bitmap, 0, 0);
    bitmap.close();
    return await new Promise(resolve => {
      canvas.toBlob(blob => resolve(blob ? URL.createObjectURL(blob) : null), 'image/jpeg', 0.85);
    });
  } catch {
    return null;
  }
}

function setPanelImage(imgId, errorId, name) {
  const img = document.getElementById(imgId);
  const errorEl = document.getElementById(errorId);
  const nameEl = document.getElementById('img-name-' + imgId.split('-').pop());
  nameEl.textContent = name;
  nameEl.title = name;
  errorEl.style.display = 'none';
  img.style.display = 'block';

  const starEl = document.getElementById('star-' + imgId.split('-').pop());
  const favorited = !!appData.images[name].favorited;
  starEl.textContent = favorited ? '★' : '☆';
  starEl.classList.toggle('favorited', favorited);

  const showError = () => {
    img.style.display = 'none';
    errorEl.textContent = `Couldn't load "${name}" — the file may be too large or corrupted.`;
    errorEl.style.display = 'flex';
  };

  img.onerror = async () => {
    const previewUrl = await downscalePreview(name);
    if (!previewUrl) { showError(); return; }
    appData.images[name].url = previewUrl;
    saveData(appData);
    img.onerror = showError;
    img.src = previewUrl;
  };
  img.src = appData.images[name].url;
}

function showRatingView(nameA, nameB) {
  // Safety net + diagnostics: this should be structurally impossible (every
  // pairing path explicitly excludes whichever name it's pairing against),
  // but it's been reported in the wild — log full context so a repro can be
  // traced from the browser console, and self-heal instead of showing it.
  if (nameA === nameB) {
    console.error('[curator] showRatingView got the same name for both panels:', nameA, {
      judgingCluster: judgingCluster ? [...judgingCluster] : null,
      judgingLastPair, lastPair,
    });
    console.trace();
    const pool = judgingCluster ? clusterPool() : ratableImages();
    const alt = Object.keys(pool).find(n => n !== nameA);
    if (alt) nameB = alt;
  }
  document.getElementById('loading-view').style.display  = 'none';
  document.getElementById('results-view').style.display  = 'none';
  document.getElementById('removed-view').style.display  = 'none';
  document.getElementById('favorites-view').style.display = 'none';
  document.getElementById('duplicates-view').style.display = 'none';
  document.getElementById('rating-view').style.display   = 'flex';
  document.getElementById('corner-controls').style.display = 'flex';
  document.getElementById('results-toggle-btn').textContent = 'Results';

  setPanelImage('img-a', 'img-error-a', nameA);
  setPanelImage('img-b', 'img-error-b', nameB);
  document.getElementById('panel-a').dataset.name = nameA;
  document.getElementById('panel-b').dataset.name = nameB;
  updateStats();
}

function makeThumbnail(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const scale = 320 / Math.max(img.naturalWidth, img.naturalHeight);
      canvas.width  = Math.round(img.naturalWidth  * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(blob => resolve(URL.createObjectURL(blob)), 'image/jpeg', 0.8);
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

// A cached thumbUrl is a blob: URL, which dies whenever the page reloads —
// it's persisted to localStorage alongside everything else, but the browser
// revokes it as soon as the tab that created it goes away. If a cached one
// fails to load (broken-image icon), regenerate it from the full-size image
// instead of leaving it broken.
function setThumbSrc(img, record) {
  const regenerate = () => {
    makeThumbnail(record.url).then(thumbUrl => {
      if (thumbUrl) {
        record.thumbUrl = thumbUrl;
        img.src = thumbUrl;
      }
    });
  };
  if (record.thumbUrl) {
    img.onerror = () => { img.onerror = null; regenerate(); };
    img.src = record.thumbUrl;
  } else {
    regenerate();
  }
}

const RESULTS_PAGE_SIZE = 50;
let resultsPage = 0;

function showResultsView() {
  cancelJudgingIfActive();
  document.getElementById('loading-view').style.display  = 'none';
  document.getElementById('rating-view').style.display   = 'none';
  document.getElementById('removed-view').style.display  = 'none';
  document.getElementById('favorites-view').style.display = 'none';
  document.getElementById('duplicates-view').style.display = 'none';
  document.getElementById('results-view').style.display  = 'flex';
  document.getElementById('results-toggle-btn').textContent = '← Rate';

  renderResultsGrid();
}

function renderResultsGrid() {
  const sorted = Object.entries(ratableImages())
    .sort((a, b) => b[1].score - a[1].score);

  const total = sorted.length;
  const pageCount = Math.max(1, Math.ceil(total / RESULTS_PAGE_SIZE));
  resultsPage = Math.min(Math.max(0, resultsPage), pageCount - 1);

  const start = resultsPage * RESULTS_PAGE_SIZE;
  const slice = sorted.slice(start, start + RESULTS_PAGE_SIZE);

  document.getElementById('results-page-label').textContent =
    total === 0 ? '' : `Page ${resultsPage + 1} of ${pageCount} (${total} total)`;
  document.getElementById('results-prev-btn').disabled = resultsPage === 0;
  document.getElementById('results-next-btn').disabled = resultsPage >= pageCount - 1;
  document.getElementById('results-jump-top-btn').disabled = resultsPage === 0;
  document.getElementById('results-jump-bottom-btn').disabled = resultsPage >= pageCount - 1;

  const grid = document.getElementById('results-grid');
  grid.innerHTML = '';

  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      observer.unobserve(entry.target);
      const cell = entry.target;
      const record = appData.images[cell.dataset.name];
      if (!record?.url) continue;
      setThumbSrc(cell.querySelector('img'), record);
    }
  }, { rootMargin: '200px' });

  const sliceNames = slice.map(([n]) => n);
  slice.forEach(([name, img], i) => {
    const rank = start + i + 1;
    const cell = document.createElement('div');
    cell.className = 'thumb-cell';
    cell.dataset.name = name;

    const thumb = document.createElement('img');
    thumb.alt = '';
    thumb.onclick = () => openLightbox(img.url, name, sliceNames, i);
    const rankEl = document.createElement('div');
    rankEl.className = 'thumb-rank' + (rank <= 3 ? ' top3' : '');
    rankEl.textContent = `#${rank}`;
    const scoreEl = document.createElement('div');
    scoreEl.className = 'thumb-score';
    scoreEl.textContent = Math.round(img.score);
    const removeBtn = document.createElement('button');
    removeBtn.className = 'restore-btn thumb-remove-btn';
    removeBtn.textContent = 'Remove';
    removeBtn.onclick = () => {
      flagImageData(name);
      renderResultsGrid();
    };
    cell.append(thumb, rankEl, scoreEl, removeBtn);

    grid.appendChild(cell);
    observer.observe(cell);
  });
}

function updateStats() {
  const low = lowGameCount(ratableImages());
  document.getElementById('stats-session').textContent =
    `${sessionComparisons} comparison${sessionComparisons === 1 ? '' : 's'} this session · ${appData.totalComparisons} total`;
  document.getElementById('stats-progress').textContent =
    low > 0
      ? `${low} image${low === 1 ? '' : 's'} with fewer than ${PROGRESS_THRESHOLD} comparisons`
      : 'Refining rankings';
  updateRemovedBadge();
  updateFavoritesBadge();
}

function updateRemovedBadge() {
  const n = flaggedImages().length;
  document.getElementById('removed-toggle-btn').textContent = n > 0 ? `Removed (${n})` : 'Removed';
}

function updateFavoritesBadge() {
  const n = favoritedImages().length;
  document.getElementById('favorites-toggle-btn').textContent = n > 0 ? `Favorites (${n})` : 'Favorites';
}

function wireLoadingEvents() {
  const input = document.getElementById('folder-input');

  const chooseBtn = document.getElementById('choose-btn');
  if (chooseBtn) chooseBtn.onclick = () => input.click();

  const resetBtn = document.getElementById('reset-data-btn');
  if (resetBtn) resetBtn.onclick = resetData;

  const dropZone = document.getElementById('drop-zone');
  if (dropZone) {
    dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('drag-over'); };
    dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
    dropZone.ondrop = e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const item = e.dataTransfer.items && e.dataTransfer.items[0];
      if (item) {
        const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
        if (entry && entry.isDirectory) {
          collectFilesFromEntry(entry).then(files => onFolderLoaded(files));
          return;
        }
      }
      onFolderLoaded(e.dataTransfer.files);
    };
  }
}

// --- EVENTS ---
function isAcceptedFile(file) {
  return ACCEPTED_EXTS.has(file.name.split('.').pop().toLowerCase());
}

async function onFolderLoaded(files) {
  const accepted = Array.from(files).filter(isAcceptedFile);

  if (accepted.length < 2) {
    showLoadingError('Select a folder with at least 2 supported images (jpg, jpeg, png, gif, webp).');
    return;
  }

  mergeFolder(appData, accepted.map(f => f.name));

  for (const file of accepted) {
    appData.images[file.name].url = URL.createObjectURL(file);
    loadedFiles.set(file.name, file);
  }

  const loadedNames = Object.keys(appData.images).filter(n => appData.images[n].url);
  if (loadedNames.length < 2) {
    showLoadingError('Fewer than 2 images loaded successfully. Try a different folder.');
    return;
  }

  saveData(appData);
  startRating();
}

function startRating() {
  cancelJudgingIfActive();
  const pool = ratableImages();
  if (Object.keys(pool).length < 2) {
    showLoadingView(appData);
    showLoadingError('Fewer than 2 non-removed images remain. Restore some from Removed, or load more.');
    return;
  }
  const pair = selectNextPair(pool, lastPair);
  lastPair = pair;
  showRatingView(pair[0], pair[1]);
}

function collectFilesFromEntry(dirEntry) {
  return new Promise(resolve => {
    const files = [];
    const reader = dirEntry.createReader();
    (function read() {
      reader.readEntries(entries => {
        if (!entries.length) { resolve(files); return; }
        Promise.all(entries.map(e =>
          e.isFile
            ? new Promise(res => e.file(f => { files.push(f); res(); }))
            : collectFilesFromEntry(e).then(sub => files.push(...sub))
        )).then(read);
      });
    })();
  });
}

document.getElementById('folder-input').addEventListener('change', e => {
  if (!e.target.files.length) return;
  onFolderLoaded(e.target.files);
  e.target.value = '';
});

document.getElementById('storage-warning').addEventListener('click', () => {
  document.getElementById('storage-warning').style.display = 'none';
});

function onPick(winnerName, loserName) {
  applyResult(winnerName, loserName, appData);
  sessionComparisons++;
  saveData(appData);
  if (judgingCluster) {
    showClusterPair();
  } else {
    startRating();
  }
}

// --- CLUSTER JUDGING (mini-tournament within one duplicate cluster) ---
let judgingCluster = null; // array of names currently being judged, or null
let judgingLastPair = null;

function cancelJudgingIfActive() {
  if (!judgingCluster) return;
  judgingCluster = null;
  document.getElementById('rating-view').classList.remove('judging-mode');
  document.getElementById('judging-banner').style.display = 'none';
}

function clusterPool() {
  const all = ratableImages();
  return Object.fromEntries(judgingCluster.filter(n => all[n]).map(n => [n, all[n]]));
}

function startClusterJudging(clusterNames) {
  const pool = ratableImages();
  judgingCluster = clusterNames.filter(n => pool[n]);
  if (judgingCluster.length < 2) {
    judgingCluster = null;
    return; // nothing to compare — Keep-only-this / individual Remove still handle this case
  }
  judgingLastPair = null;
  document.getElementById('rating-view').classList.add('judging-mode');
  document.getElementById('judging-banner').style.display = 'flex';
  showClusterPair();
}

function showClusterPair() {
  const pool = clusterPool();
  const names = Object.keys(pool);
  if (names.length < 2) {
    endClusterJudging();
    return;
  }
  const pair = selectNextPair(pool, judgingLastPair);
  judgingLastPair = pair;
  showRatingView(pair[0], pair[1]);
  document.getElementById('judging-count').textContent =
    `${names.length} image${names.length === 1 ? '' : 's'} left`;
}

// Remove one image while judging a cluster — same idea as removeAndReplace,
// but the replacement is drawn from the rest of this cluster only, not the
// whole pool. Flagging here goes straight to Removed, same as everywhere else.
function removeFromCluster(removedIsA) {
  const aName = document.getElementById('panel-a').dataset.name;
  const bName = document.getElementById('panel-b').dataset.name;
  const removedName = removedIsA ? aName : bName;
  const keepName = removedIsA ? bName : aName;
  if (!removedName) return;

  flagImageData(removedName);

  const pool = clusterPool();
  const candidates = Object.keys(pool).filter(n => n !== keepName);

  if (!pool[keepName] || candidates.length === 0) {
    // Nothing left in this cluster to compare against — finish up.
    endClusterJudging();
    return;
  }

  const replacement = pickOneNear(pool, candidates, keepName);
  const newPair = removedIsA ? [replacement, keepName] : [keepName, replacement];
  judgingLastPair = newPair;
  showRatingView(newPair[0], newPair[1]);
  document.getElementById('judging-count').textContent =
    `${candidates.length + 1} image${candidates.length === 0 ? '' : 's'} left`;
}

function endClusterJudging() {
  const names = judgingCluster;
  judgingCluster = null;
  document.getElementById('rating-view').classList.remove('judging-mode');
  document.getElementById('judging-banner').style.display = 'none';
  // Hide the rating view instead of leaving the last (possibly stale, or
  // just-removed) pair visible behind the review modal.
  document.getElementById('rating-view').style.display = 'none';
  showClusterReview(names);
}

document.getElementById('judging-done-btn').addEventListener('click', endClusterJudging);

// --- CLUSTER REVIEW (choose how many of the judged cluster to keep) ---
let clusterReviewNames = [];
let clusterReviewKeep = new Set();

function showClusterReview(clusterNames) {
  const names = clusterNames.filter(n => appData.images[n]?.url && !appData.images[n].flagged);
  if (names.length === 0) { showDuplicatesView(); return; }
  names.sort((a, b) => appData.images[b].score - appData.images[a].score);
  clusterReviewNames = names;
  // Default: keep the top scorer, plus any favorited images in the cluster —
  // a star is a signal you already like that one, so don't make the user
  // re-confirm it on top of favoriting it.
  clusterReviewKeep = new Set([names[0], ...names.filter(n => appData.images[n].favorited)]);
  document.getElementById('cluster-review-heading').textContent = names.length === 1
    ? "Only one image is left in this cluster — there's no second image to compare it against."
    : 'Keep which of these?';
  renderClusterReview();
  document.getElementById('cluster-review').style.display = 'flex';
}

function renderClusterReview() {
  const grid = document.getElementById('cluster-review-grid');
  grid.innerHTML = '';
  clusterReviewNames.forEach((name, i) => {
    const record = appData.images[name];
    const kept = clusterReviewKeep.has(name);
    const cell = document.createElement('div');
    cell.className = 'cluster-review-cell' + (kept ? ' selected' : '');
    const img = document.createElement('img');
    img.alt = '';
    img.onclick = () => openLightbox(record.url, name, clusterReviewNames, i);
    setThumbSrc(img, record);
    const rankEl = document.createElement('div');
    rankEl.className = 'cluster-review-rank';
    rankEl.textContent = `#${i + 1} · ${Math.round(record.score)}`;
    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'cluster-review-toggle';
    toggleBtn.textContent = kept ? '✓ Keep' : 'Keep';
    toggleBtn.onclick = () => {
      // No minimum: if you don't like anything in the cluster, uncheck
      // them all and every image gets flagged.
      if (kept) clusterReviewKeep.delete(name);
      else clusterReviewKeep.add(name);
      renderClusterReview();
    };
    cell.append(img, rankEl, toggleBtn);
    grid.appendChild(cell);
  });
  document.getElementById('cluster-review-confirm').textContent =
    `Confirm — keep ${clusterReviewKeep.size}, remove ${clusterReviewNames.length - clusterReviewKeep.size}`;
}

document.getElementById('cluster-review-confirm').addEventListener('click', () => {
  for (const name of clusterReviewNames) {
    if (!clusterReviewKeep.has(name)) flagImageData(name);
  }
  document.getElementById('cluster-review').style.display = 'none';
  showDuplicatesView();
});

document.getElementById('cluster-review-cancel').addEventListener('click', () => {
  document.getElementById('cluster-review').style.display = 'none';
  showDuplicatesView();
});

function flagImageData(name) {
  appData.images[name].flagged = true;
  saveData(appData);
  updateRemovedBadge();
}

// Favoriting is a pure bookmark — it never touches score, flagged, or
// rotation. Toggling mid-tournament re-applies the star to whichever panel
// is currently showing that image, without advancing the pair.
function toggleFavorite(name) {
  appData.images[name].favorited = !appData.images[name].favorited;
  saveData(appData);
  updateFavoritesBadge();
  ['a', 'b'].forEach(side => {
    if (document.getElementById('panel-' + side).dataset.name === name) {
      const starEl = document.getElementById('star-' + side);
      const favorited = appData.images[name].favorited;
      starEl.textContent = favorited ? '★' : '☆';
      starEl.classList.toggle('favorited', favorited);
    }
  });
  if (document.getElementById('favorites-view').style.display !== 'none') {
    renderFavoritesGrid();
  }
}

// Remove one image from the current pair without advancing the whole pair —
// only the removed slot gets a fresh replacement, so the surviving image
// stays put and can also be removed right after if it's no good either.
function removeAndReplace(removedIsA) {
  const aName = document.getElementById('panel-a').dataset.name;
  const bName = document.getElementById('panel-b').dataset.name;
  const removedName = removedIsA ? aName : bName;
  const keepName = removedIsA ? bName : aName;
  if (!removedName) return;

  flagImageData(removedName);

  const pool = ratableImages();
  const candidates = Object.keys(pool).filter(n => n !== keepName);

  if (!pool[keepName] || candidates.length === 0) {
    // Surviving image also got flagged/lost, or nothing left to pair it
    // with — fall back to picking a whole fresh pair.
    startRating();
    return;
  }

  const replacement = pickOneNear(pool, candidates, keepName);
  const newPair = removedIsA ? [replacement, keepName] : [keepName, replacement];
  lastPair = newPair;
  showRatingView(newPair[0], newPair[1]);
}

function unflagImage(name) {
  appData.images[name].flagged = false;
  saveData(appData);
  updateRemovedBadge();
  if (document.getElementById('removed-view').style.display !== 'none') {
    showRemovedView();
  }
}

const REMOVED_PAGE_SIZE = 50;

// --- DUPLICATES ---
const DUP_PAGE_SIZE = 20; // clusters per page
let dupPage = 0;
let dupSortBySize = true; // largest clusters first, by default

function basename(p) {
  return p.split(/[\\/]/).pop();
}

function loadDuplicateReport(jsonText) {
  const errorEl = document.getElementById('dup-error');
  errorEl.textContent = '';
  let raw;
  try {
    raw = JSON.parse(jsonText);
  } catch (e) {
    errorEl.textContent = `Couldn't parse report: ${e.message}`;
    return;
  }
  if (!Array.isArray(raw)) {
    errorEl.textContent = 'Report must be a JSON array of clusters.';
    return;
  }
  // basename() collapses full paths down to filenames (the data model is
  // keyed by filename), so two different files from different subfolders
  // that share a name would otherwise appear twice in the same cluster —
  // dedupe here so no cluster array can ever contain the same name twice.
  appData.duplicateClusters = raw
    .map(group => Array.isArray(group) ? [...new Set(group.map(basename))] : [])
    .filter(g => g.length > 1);
  saveData(appData);
  dupPage = 0;
  renderDuplicatesView();
}

// Clusters filtered down to images actually loaded this session and not
// already flagged — a cluster with 0 or 1 unresolved members needs no
// further review and drops out on its own as you clean things up. Dedupe
// defensively too, in case a report saved before the loadDuplicateReport
// fix is still sitting in localStorage.
function activeDuplicateClusters() {
  return appData.duplicateClusters
    .map(names => [...new Set(names)].filter(n => appData.images[n]?.url && !appData.images[n].flagged))
    .filter(g => g.length > 1);
}

function keepOnlyInCluster(clusterNames, keepName) {
  for (const n of clusterNames) {
    if (n !== keepName) flagImageData(n);
  }
  renderDuplicatesView();
}

function removeDupImage(name) {
  flagImageData(name);
  renderDuplicatesView();
}

function renderDuplicatesView() {
  const clusters = activeDuplicateClusters();
  if (dupSortBySize) clusters.sort((a, b) => b.length - a.length);
  const total = clusters.length;
  const pageCount = Math.max(1, Math.ceil(total / DUP_PAGE_SIZE));
  dupPage = Math.min(Math.max(0, dupPage), pageCount - 1);

  const start = dupPage * DUP_PAGE_SIZE;
  const page = clusters.slice(start, start + DUP_PAGE_SIZE);

  document.getElementById('dup-page-label').textContent =
    total === 0 ? '' : `Page ${dupPage + 1} of ${pageCount} (${total} cluster${total === 1 ? '' : 's'})`;
  document.getElementById('dup-prev-btn').disabled = dupPage === 0;
  document.getElementById('dup-next-btn').disabled = dupPage >= pageCount - 1;

  const container = document.getElementById('dup-clusters');
  container.innerHTML = '';
  document.getElementById('dup-empty').style.display =
    appData.duplicateClusters.length === 0 || total === 0 ? 'flex' : 'none';
  if (appData.duplicateClusters.length > 0 && total === 0) {
    document.getElementById('dup-empty').innerHTML = 'All duplicate clusters resolved. \u{1F389}';
  }

  // Lazy: only decode/generate a thumbnail once its cell actually scrolls
  // into view. Generating one means decoding the full-size original file,
  // which for large source images means real disk I/O — doing that for
  // every image in every cluster up front is expensive for no reason when
  // most of them aren't even on screen yet.
  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      observer.unobserve(entry.target);
      const cell = entry.target;
      const record = appData.images[cell.dataset.name];
      if (!record?.url) continue;
      setThumbSrc(cell.querySelector('img'), record);
    }
  }, { rootMargin: '200px' });

  page.forEach(clusterNames => {
    const clusterEl = document.createElement('div');
    clusterEl.className = 'dup-cluster';

    const labelRow = document.createElement('div');
    labelRow.className = 'dup-cluster-label-row';
    const label = document.createElement('div');
    label.className = 'dup-cluster-label';
    label.textContent = `${clusterNames.length} similar images`;
    const judgeBtn = document.createElement('button');
    judgeBtn.className = 'btn';
    judgeBtn.textContent = 'Judge this cluster';
    judgeBtn.onclick = () => startClusterJudging(clusterNames);
    labelRow.append(label, judgeBtn);
    clusterEl.appendChild(labelRow);

    const thumbsEl = document.createElement('div');
    thumbsEl.className = 'dup-thumbs';

    clusterNames.forEach((name, i) => {
      const record = appData.images[name];
      const cell = document.createElement('div');
      cell.className = 'dup-thumb-cell';
      cell.dataset.name = name;

      const thumb = document.createElement('img');
      thumb.alt = '';
      thumb.title = name;
      thumb.onclick = () => openLightbox(record.url, name, clusterNames, i);

      const btns = document.createElement('div');
      btns.className = 'dup-thumb-btns';
      const keepBtn = document.createElement('button');
      keepBtn.className = 'dup-keep-btn';
      keepBtn.textContent = 'Keep only this';
      keepBtn.onclick = () => keepOnlyInCluster(clusterNames, name);
      const removeBtn = document.createElement('button');
      removeBtn.className = 'dup-remove-btn';
      removeBtn.textContent = '🗑️';
      removeBtn.title = 'Remove this one';
      removeBtn.onclick = () => removeDupImage(name);
      btns.append(keepBtn, removeBtn);

      cell.append(thumb, btns);
      thumbsEl.appendChild(cell);
      observer.observe(cell);
    });

    clusterEl.appendChild(thumbsEl);
    container.appendChild(clusterEl);
  });
}

// `list` is the full array of names the clicked thumbnail belongs to (its
// grid page, cluster, etc.) and `index` is its position in it — together
// they let the lightbox step to the next/previous image in that same set.
let lightboxList = null;
let lightboxIndex = -1;

function openLightbox(url, name, list, index) {
  if (!url) return;
  lightboxList = list && list.length > 1 ? list : null;
  lightboxIndex = lightboxList ? index : -1;
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-name').textContent = name;
  document.getElementById('lightbox').style.display = 'flex';
  document.getElementById('lightbox-prev').style.display = lightboxList ? 'flex' : 'none';
  document.getElementById('lightbox-next').style.display = lightboxList ? 'flex' : 'none';
}

function lightboxStep(delta) {
  if (!lightboxList) return;
  lightboxIndex = (lightboxIndex + delta + lightboxList.length) % lightboxList.length;
  const name = lightboxList[lightboxIndex];
  const record = appData.images[name];
  if (!record?.url) return;
  document.getElementById('lightbox-img').src = record.url;
  document.getElementById('lightbox-name').textContent = name;
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('lightbox-img').src = '';
  lightboxList = null;
  lightboxIndex = -1;
}

document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox') closeLightbox();
});
document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox-prev').addEventListener('click', e => { e.stopPropagation(); lightboxStep(-1); });
document.getElementById('lightbox-next').addEventListener('click', e => { e.stopPropagation(); lightboxStep(1); });
document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').style.display === 'none') return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lightboxStep(-1);
  if (e.key === 'ArrowRight') lightboxStep(1);
});

document.getElementById('panel-a').addEventListener('click', () => {
  const a = document.getElementById('panel-a').dataset.name;
  const b = document.getElementById('panel-b').dataset.name;
  if (a && b) onPick(a, b);
});

document.getElementById('panel-b').addEventListener('click', () => {
  const a = document.getElementById('panel-a').dataset.name;
  const b = document.getElementById('panel-b').dataset.name;
  if (a && b) onPick(b, a);
});

document.getElementById('flag-a').addEventListener('click', e => {
  e.stopPropagation();
  if (!document.getElementById('panel-a').dataset.name) return;
  if (judgingCluster) removeFromCluster(true);
  else removeAndReplace(true);
});

document.getElementById('flag-b').addEventListener('click', e => {
  e.stopPropagation();
  if (!document.getElementById('panel-b').dataset.name) return;

  else removeAndReplace(false);
});

document.getElementById('star-a').addEventListener('click', e => {
  e.stopPropagation();
  const name = document.getElementById('panel-a').dataset.name;
  if (name) toggleFavorite(name);
});

document.getElementById('star-b').addEventListener('click', e => {
  e.stopPropagation();
  const name = document.getElementById('panel-b').dataset.name;
  if (name) toggleFavorite(name);
});

document.getElementById('favorites-toggle-btn').addEventListener('click', () => {
  if (document.getElementById('favorites-view').style.display === 'none') {
    favoritesPage = 0;
    showFavoritesView();
  } else {
    startRating();
  }
});

document.getElementById('favorites-prev-btn').addEventListener('click', () => {
  favoritesPage = Math.max(0, favoritesPage - 1);
  renderFavoritesGrid();
});

document.getElementById('favorites-next-btn').addEventListener('click', () => {
  favoritesPage++;
  renderFavoritesGrid();
});

document.getElementById('removed-toggle-btn').addEventListener('click', () => {
  if (document.getElementById('removed-view').style.display === 'none') {
    removedPage = 0;
    showRemovedView();
  } else {
    startRating();
  }
});

document.getElementById('removed-prev-btn').addEventListener('click', () => {
  removedPage = Math.max(0, removedPage - 1);
  renderRemovedGrid();
});

document.getElementById('removed-next-btn').addEventListener('click', () => {
  removedPage++;
  renderRemovedGrid();
});

document.getElementById('duplicates-toggle-btn').addEventListener('click', () => {
  if (document.getElementById('duplicates-view').style.display === 'none') {
    dupPage = 0;
    showDuplicatesView();
  } else {
    startRating();
  }
});

document.getElementById('dup-prev-btn').addEventListener('click', () => {
  dupPage = Math.max(0, dupPage - 1);
  renderDuplicatesView();
});

document.getElementById('dup-next-btn').addEventListener('click', () => {
  dupPage++;
  renderDuplicatesView();
});

document.getElementById('dup-load-btn').addEventListener('click', () => {
  document.getElementById('dup-report-input').click();
});

document.getElementById('dup-sort-btn').addEventListener('click', () => {
  dupSortBySize = !dupSortBySize;
  document.getElementById('dup-sort-btn').textContent = dupSortBySize ? 'Sort: Largest first' : 'Sort: Report order';
  dupPage = 0;
  renderDuplicatesView();
});

document.getElementById('dup-report-input').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  file.text().then(loadDuplicateReport);
});

document.getElementById('switch-folder-btn').addEventListener('click', () => {
  showLoadingView(appData);
});

document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').style.display !== 'none') return;
  if (document.getElementById('rating-view').style.display === 'none') return;
  const a = document.getElementById('panel-a').dataset.name;
  const b = document.getElementById('panel-b').dataset.name;
  if (!a || !b) return;

  if (e.key === 'ArrowRight') onPick(b, a);
});

document.getElementById('results-toggle-btn').addEventListener('click', () => {
  if (document.getElementById('results-view').style.display === 'none') {
    resultsPage = 0;
    showResultsView();
  } else {
    showRatingView(
      document.getElementById('panel-a').dataset.name,
      document.getElementById('panel-b').dataset.name
    );
  }
});

document.getElementById('results-jump-top-btn').addEventListener('click', () => {
  resultsPage = 0;
  renderResultsGrid();
});

document.getElementById('results-jump-bottom-btn').addEventListener('click', () => {
  resultsPage = Infinity; // clamped to the last page inside renderResultsGrid
  renderResultsGrid();
});

document.getElementById('results-prev-btn').addEventListener('click', () => {
  resultsPage = Math.max(0, resultsPage - 1);
  renderResultsGrid();
});

document.getElementById('results-next-btn').addEventListener('click', () => {
  resultsPage++;
  renderResultsGrid();
});

function exportCSV() {
  const rows = Object.entries(appData.images)
    .filter(([, img]) => img.games > 0 || img.url)
    .sort((a, b) => b[1].score - a[1].score)
    .map(([name, img]) =>
      [name, img.score.toFixed(2), img.wins, img.losses, img.games].join(',')
    );
  const csv = ['filename,score,wins,losses,games', ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'elo-rankings.csv';
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('export-btn').addEventListener('click', exportCSV);
