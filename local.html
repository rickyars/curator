<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Elo Rater</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Loading view -->
<div id="loading-view"></div>

<!-- Rating view -->
<div id="rating-view">
  <div class="images-row">
    <div class="image-panel" id="panel-a"><img id="img-a" src="" alt=""><div class="img-error" id="img-error-a" style="display:none;"></div><button class="flag-btn" id="flag-a" title="Remove from tournament">🗑️</button></div>
    <div class="image-divider"></div>
    <div class="image-panel" id="panel-b"><img id="img-b" src="" alt=""><div class="img-error" id="img-error-b" style="display:none;"></div><button class="flag-btn" id="flag-b" title="Remove from tournament">🗑️</button></div>
  </div>
  <div class="stats-bar">
    <span id="stats-session"></span>
    <span style="color:#2a2a2a;">← → to pick · click to pick</span>
    <span id="stats-progress"></span>
  </div>
</div>

<!-- Results view -->
<div id="results-view">
  <div class="results-toolbar">
    <button class="btn" id="results-jump-top-btn">&uarr; Top</button>
    <button class="btn" id="results-prev-btn">&larr; Prev</button>
    <span id="results-page-label"></span>
    <button class="btn" id="results-next-btn">Next &rarr;</button>
    <button class="btn" id="results-jump-bottom-btn">&darr; Bottom</button>
  </div>
  <div class="results-grid" id="results-grid"></div>
</div>

<!-- Removed view -->
<div id="removed-view">
  <div class="results-toolbar">
    <button class="btn" id="removed-prev-btn">&larr; Prev</button>
    <span id="removed-page-label"></span>
    <button class="btn" id="removed-next-btn">Next &rarr;</button>
  </div>
  <div class="removed-empty" id="removed-empty" style="display:none;">No images removed</div>
  <div class="results-grid" id="removed-grid"></div>
</div>

<!-- Fixed corner controls (always visible once a folder is loaded) -->
<div id="corner-controls" style="display:none;">
  <button class="btn" id="results-toggle-btn">Results</button>
  <button class="btn" id="removed-toggle-btn">Removed</button>
  <button class="btn" id="export-btn">Export CSV</button>
  <button class="btn" id="switch-folder-btn">Switch Folder</button>
</div>

<!-- Storage warning -->
<div id="storage-warning">⚠ Could not save scores (storage full). Click to dismiss.</div>

<!-- Hidden file input (no accept — webkitdirectory ignores it) -->
<input type="file" id="folder-input" webkitdirectory multiple style="display:none">

<script>
// --- CONFIG ---
const STORAGE_KEY = 'elo-rater-data';
const K_HIGH = 32;
const K_LOW = 16;
const K_THRESHOLD = 10;
const LOW_GAME_CAP = 15;
const PROGRESS_THRESHOLD = 5;
const ACCEPTED_EXTS = new Set(['jpg', 'jpeg', 'png', 'gif', 'webp']);

// --- STORAGE ---
function emptyData() {
  return { images: {}, totalComparisons: 0, lastSession: null };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyData();
    const parsed = JSON.parse(raw);
    return {
      images: parsed.images || {},
      totalComparisons: parsed.totalComparisons || 0,
      lastSession: parsed.lastSession || null,
    };
  } catch {
    return emptyData();
  }
}

function saveData(data) {
  const payload = {
    images: data.images,
    totalComparisons: data.totalComparisons,
    lastSession: Date.now(),
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch {
    document.getElementById('storage-warning').style.display = 'block';
  }
}

function mergeFolder(data, filenames) {
  for (const name of filenames) {
    if (!data.images[name]) {
      data.images[name] = { score: 1000, wins: 0, losses: 0, games: 0, flagged: false };
    }
  }
}

// --- ELO ---
function expectedScore(scoreA, scoreB) {
  return 1 / (1 + Math.pow(10, (scoreB - scoreA) / 400));
}

function applyResult(winnerName, loserName, data) {
  const winner = data.images[winnerName];
  const loser  = data.images[loserName];
  const kWinner = winner.games < K_THRESHOLD ? K_HIGH : K_LOW;
  const kLoser  = loser.games  < K_THRESHOLD ? K_HIGH : K_LOW;
  const exp = expectedScore(winner.score, loser.score);
  winner.score += kWinner * (1 - exp);
  loser.score  -= kLoser  * (1 - exp);
  winner.wins++;
  winner.games++;
  loser.losses++;
  loser.games++;
  data.totalComparisons++;
}

// --- PAIRING ---
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function weightedRandom(items) {
  const total = items.reduce((sum, x) => sum + x.weight, 0);
  let r = Math.random() * total;
  for (const item of items) {
    r -= item.weight;
    if (r <= 0) return item.name;
  }
  return items[items.length - 1].name;
}

function selectNextPair(images, lastPair) {
  const allNames = Object.keys(images);

  // Never reoffer either image from the immediately previous pair — a hard
  // exclusion, not just a bias — whenever the pool is big enough to allow it.
  const excludeSet = lastPair ? new Set(lastPair) : new Set();
  const available = allNames.filter(n => !excludeSet.has(n));
  const names = available.length >= 2 ? available : allNames;

  // Player A: weighted by 1/(games+1) — zero-game images have highest priority
  const weights = names.map(n => ({ name: n, weight: 1 / (images[n].games + 1) }));
  const playerA = weightedRandom(weights);

  // Player B: closest Elo among low-game candidates; fall back to all if none qualify
  const pickB = (excludeA) => {
    const others = names.filter(n => n !== excludeA);
    let pool = others.filter(n => images[n].games < LOW_GAME_CAP);
    if (pool.length === 0) pool = others;
    // Shuffle first: Array.sort is stable, so without this, tied scores
    // (e.g. everyone at the 1000 starting score) would always resolve in
    // the same insertion/alphabetical order instead of randomly.
    shuffle(pool).sort((a, b) =>
      Math.abs(images[a].score - images[excludeA].score) -
      Math.abs(images[b].score - images[excludeA].score)
    );
    return pool;
  };

  const bCandidates = pickB(playerA);
  const topN = bCandidates.slice(0, Math.min(3, bCandidates.length));
  const playerB = topN[Math.floor(Math.random() * topN.length)];

  return [playerA, playerB];
}

// --- UI ---
function relativeDate(ts) {
  if (!ts) return 'a while ago';
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return 'yesterday';
  return `${days} days ago`;
}

function lowGameCount(images) {
  return Object.values(images).filter(img => img.games < PROGRESS_THRESHOLD).length;
}

function loadedImages() {
  return Object.fromEntries(Object.entries(appData.images).filter(([, v]) => v.url));
}

function ratableImages() {
  return Object.fromEntries(Object.entries(loadedImages()).filter(([, v]) => !v.flagged));
}

function flaggedImages() {
  return Object.entries(loadedImages()).filter(([, v]) => v.flagged);
}

function showLoadingView(data) {
  document.getElementById('rating-view').style.display   = 'none';
  document.getElementById('results-view').style.display  = 'none';
  document.getElementById('removed-view').style.display  = 'none';
  document.getElementById('corner-controls').style.display = 'none';
  const view = document.getElementById('loading-view');
  view.style.display = 'flex';

  const hasData = Object.keys(data.images).length > 0;
  const count = Object.keys(data.images).length;
  const statusLine = hasData
    ? `<div style="margin-top:10px;font-size:11px;color:#555;">${count} image${count === 1 ? '' : 's'} ranked so far &middot; last session ${relativeDate(data.lastSession)}</div>`
    : '';
  const resetBtn = hasData
    ? `<button class="btn btn-danger" id="reset-data-btn" style="margin-top:12px;">Reset data</button>`
    : '';

  view.innerHTML = `
    <div>
      <div class="drop-zone" id="drop-zone">
        <div class="icon">📁</div>
        <p>Drop a folder here, or click to choose one</p>
        <button class="btn" id="choose-btn">Choose folder</button>
        <div style="margin-top:10px;font-size:11px;color:#444;">Accepts jpg, jpeg, png, gif, webp</div>
        ${statusLine}
      </div>
      ${resetBtn}
      <div class="loading-error" id="loading-error"></div>
    </div>`;
  wireLoadingEvents();
}

function resetData() {
  const ok = confirm('Reset all local data? This permanently deletes every score, win/loss record, and flag for every image, across every folder you\'ve rated. This cannot be undone.');
  if (!ok) return;
  localStorage.removeItem(STORAGE_KEY);
  appData = emptyData();
  loadedFiles = new Map();
  showLoadingView(appData);
}

function showLoadingError(msg) {
  const el = document.getElementById('loading-error');
  if (!el) return;
  el.textContent = msg;
  el.style.display = 'block';
}

// Some images (very large dimensions/file size) fail to decode as a plain
// <img>. If that happens, retry via createImageBitmap with a resize request,
// which can succeed where direct decoding doesn't, and cache the downscaled
// preview so future pairings involving this image don't re-pay the cost.
async function downscalePreview(name) {
  const file = loadedFiles.get(name);
  if (!file) return null;
  try {
    const bitmap = await createImageBitmap(file, { resizeWidth: 2000, resizeQuality: 'medium' });
    const canvas = document.createElement('canvas');
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    canvas.getContext('2d').drawImage(bitmap, 0, 0);
    bitmap.close();
    return await new Promise(resolve => {
      canvas.toBlob(blob => resolve(blob ? URL.createObjectURL(blob) : null), 'image/jpeg', 0.85);
    });
  } catch {
    return null;
  }
}

function setPanelImage(imgId, errorId, name) {
  const img = document.getElementById(imgId);
  const errorEl = document.getElementById(errorId);
  errorEl.style.display = 'none';
  img.style.display = 'block';

  const showError = () => {
    img.style.display = 'none';
    errorEl.textContent = `Couldn't load "${name}" — the file may be too large or corrupted.`;
    errorEl.style.display = 'flex';
  };

  img.onerror = async () => {
    const previewUrl = await downscalePreview(name);
    if (!previewUrl) { showError(); return; }
    appData.images[name].url = previewUrl;
    saveData(appData);
    img.onerror = showError;
    img.src = previewUrl;
  };
  img.src = appData.images[name].url;
}

function showRatingView(nameA, nameB) {
  document.getElementById('loading-view').style.display  = 'none';
  document.getElementById('results-view').style.display  = 'none';
  document.getElementById('removed-view').style.display  = 'none';
  document.getElementById('rating-view').style.display   = 'flex';
  document.getElementById('corner-controls').style.display = 'flex';
  document.getElementById('results-toggle-btn').textContent = 'Results';

  setPanelImage('img-a', 'img-error-a', nameA);
  setPanelImage('img-b', 'img-error-b', nameB);
  document.getElementById('panel-a').dataset.name = nameA;
  document.getElementById('panel-b').dataset.name = nameB;
  updateStats();
}

function makeThumbnail(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const scale = 320 / Math.max(img.naturalWidth, img.naturalHeight);
      canvas.width  = Math.round(img.naturalWidth  * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(blob => resolve(URL.createObjectURL(blob)), 'image/jpeg', 0.8);
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}

const RESULTS_PAGE_SIZE = 50;
let resultsPage = 0;

function showResultsView() {
  document.getElementById('loading-view').style.display  = 'none';
  document.getElementById('rating-view').style.display   = 'none';
  document.getElementById('removed-view').style.display  = 'none';
  document.getElementById('results-view').style.display  = 'flex';
  document.getElementById('results-toggle-btn').textContent = '← Rate';

  renderResultsGrid();
}

function renderResultsGrid() {
  const sorted = Object.entries(ratableImages())
    .sort((a, b) => b[1].score - a[1].score);

  const total = sorted.length;
  const pageCount = Math.max(1, Math.ceil(total / RESULTS_PAGE_SIZE));
  resultsPage = Math.min(Math.max(0, resultsPage), pageCount - 1);

  const start = resultsPage * RESULTS_PAGE_SIZE;
  const slice = sorted.slice(start, start + RESULTS_PAGE_SIZE);

  document.getElementById('results-page-label').textContent =
    total === 0 ? '' : `Page ${resultsPage + 1} of ${pageCount} (${total} total)`;
  document.getElementById('results-prev-btn').disabled = resultsPage === 0;
  document.getElementById('results-next-btn').disabled = resultsPage >= pageCount - 1;
  document.getElementById('results-jump-top-btn').disabled = resultsPage === 0;
  document.getElementById('results-jump-bottom-btn').disabled = resultsPage >= pageCount - 1;

  const grid = document.getElementById('results-grid');
  grid.innerHTML = '';

  const observer = new IntersectionObserver(entries => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      observer.unobserve(entry.target);
      const cell = entry.target;
      const record = appData.images[cell.dataset.name];
      if (!record?.url) continue;
      if (record.thumbUrl) {
        cell.querySelector('img').src = record.thumbUrl;
      } else {
        makeThumbnail(record.url).then(thumbUrl => {
          if (thumbUrl) {
            record.thumbUrl = thumbUrl;
            cell.querySelector('img').src = thumbUrl;
          }
        });
      }
    }
  }, { rootMargin: '200px' });

  slice.forEach(([name, img], i) => {
    const rank = start + i + 1;
    const cell = document.createElement('div');
    cell.className = 'thumb-cell';
    cell.dataset.name = name;

    const thumb = document.createElement('img');
    thumb.alt = '';
    const rankEl = document.createElement('div');
    rankEl.className = 'thumb-rank' + (rank <= 3 ? ' top3' : '');
    rankEl.textContent = `#${rank}`;
    const scoreEl = document.createElement('div');
    scoreEl.className = 'thumb-score';
    scoreEl.textContent = Math.round(img.score);
    const removeBtn = document.createElement('button');
    removeBtn.className = 'restore-btn thumb-remove-btn';
    removeBtn.textContent = 'Remove';
    removeBtn.onclick = () => {
      flagImageData(name);
      renderResultsGrid();
    };
    cell.append(thumb, rankEl, scoreEl, removeBtn);

    grid.appendChild(cell);
    observer.observe(cell);
  });
}

function updateStats() {
  const low = lowGameCount(ratableImages());
  document.getElementById('stats-session').textContent =
    `${sessionComparisons} comparison${sessionComparisons === 1 ? '' : 's'} this session · ${appData.totalComparisons} total`;
  document.getElementById('stats-progress').textContent =
    low > 0
      ? `${low} image${low === 1 ? '' : 's'} with fewer than ${PROGRESS_THRESHOLD} comparisons`
      : 'Refining rankings';
  updateRemovedBadge();
}

function updateRemovedBadge() {
  const n = flaggedImages().length;
  document.getElementById('removed-toggle-btn').textContent = n > 0 ? `Removed (${n})` : 'Removed';
}

function wireLoadingEvents() {
  const input = document.getElementById('folder-input');

  const chooseBtn = document.getElementById('choose-btn');
  if (chooseBtn) chooseBtn.onclick = () => input.click();

  const resetBtn = document.getElementById('reset-data-btn');
  if (resetBtn) resetBtn.onclick = resetData;

  const dropZone = document.getElementById('drop-zone');
  if (dropZone) {
    dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('drag-over'); };
    dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
    dropZone.ondrop = e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const item = e.dataTransfer.items && e.dataTransfer.items[0];
      if (item) {
        const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
        if (entry && entry.isDirectory) {
          collectFilesFromEntry(entry).then(files => onFolderLoaded(files));
          return;
        }
      }
      onFolderLoaded(e.dataTransfer.files);
    };
  }
}

// --- EVENTS ---
function isAcceptedFile(file) {
  return ACCEPTED_EXTS.has(file.name.split('.').pop().toLowerCase());
}

async function onFolderLoaded(files) {
  const accepted = Array.from(files).filter(isAcceptedFile);

  if (accepted.length < 2) {
    showLoadingError('Select a folder with at least 2 supported images (jpg, jpeg, png, gif, webp).');
    return;
  }

  mergeFolder(appData, accepted.map(f => f.name));

  for (const file of accepted) {
    appData.images[file.name].url = URL.createObjectURL(file);
    loadedFiles.set(file.name, file);
  }

  const loadedNames = Object.keys(appData.images).filter(n => appData.images[n].url);
  if (loadedNames.length < 2) {
    showLoadingError('Fewer than 2 images loaded successfully. Try a different folder.');
    return;
  }

  saveData(appData);
  startRating();
}

function startRating() {
  const pool = ratableImages();
  if (Object.keys(pool).length < 2) {
    showLoadingView(appData);
    showLoadingError('Fewer than 2 non-removed images remain. Restore some from Removed, or load more.');
    return;
  }
  const pair = selectNextPair(pool, lastPair);
  lastPair = pair;
  showRatingView(pair[0], pair[1]);
}

function collectFilesFromEntry(dirEntry) {
  return new Promise(resolve => {
    const files = [];
    const reader = dirEntry.createReader();
    (function read() {
      reader.readEntries(entries => {
        if (!entries.length) { resolve(files); return; }
        Promise.all(entries.map(e =>
          e.isFile
            ? new Promise(res => e.file(f => { files.push(f); res(); }))
            : collectFilesFromEntry(e).then(sub => files.push(...sub))
        )).then(read);
      });
    })();
  });
}

document.getElementById('folder-input').addEventListener('change', e => {
  if (!e.target.files.length) return;
  onFolderLoaded(e.target.files);
  e.target.value = '';
});

document.getElementById('storage-warning').addEventListener('click', () => {
  document.getElementById('storage-warning').style.display = 'none';
});

function onPick(winnerName, loserName) {
  applyResult(winnerName, loserName, appData);
  sessionComparisons++;
  saveData(appData);
  startRating();
}

function flagImageData(name) {
  appData.images[name].flagged = true;
  saveData(appData);
  updateRemovedBadge();
}

function flagImage(name) {
  flagImageData(name);
  startRating();
}

function unflagImage(name) {
  appData.images[name].flagged = false;
  saveData(appData);
  updateRemovedBadge();
  if (document.getElementById('removed-view').style.display !== 'none') {
    showRemovedView();
  }
}

const REMOVED_PAGE_SIZE = 50;
let removedPage = 0;

function showRemovedView() {
  document.getElementById('loading-view').style.display  = 'none';
  document.getElementById('rating-view').style.display   = 'none';
  document.getElementById('results-view').style.display  = 'none';
  document.getElementById('removed-view').style.display  = 'flex';
  document.getElementById('results-toggle-btn').textContent = 'Results';
  renderRemovedGrid();
}

function renderRemovedGrid() {
  const entries = flaggedImages().sort((a, b) => a[0].localeCompare(b[0]));
  const pageCount = Math.max(1, Math.ceil(entries.length / REMOVED_PAGE_SIZE));
  removedPage = Math.min(removedPage, pageCount - 1);

  const start = removedPage * REMOVED_PAGE_SIZE;
  const page = entries.slice(start, start + REMOVED_PAGE_SIZE);

  document.getElementById('removed-page-label').textContent =
    entries.length === 0 ? '' : `Page ${removedPage + 1} of ${pageCount} (${entries.length} removed)`;
  document.getElementById('removed-prev-btn').disabled = removedPage === 0;
  document.getElementById('removed-next-btn').disabled = removedPage >= pageCount - 1;

  const grid = document.getElementById('removed-grid');
  grid.innerHTML = '';
  document.getElementById('removed-empty').style.display = entries.length === 0 ? 'flex' : 'none';

  page.forEach(([name, record]) => {
    const cell = document.createElement('div');
    cell.className = 'thumb-cell';
    const img = document.createElement('img');
    img.src = record.thumbUrl || record.url;
    img.alt = '';
    const nameEl = document.createElement('div');
    nameEl.className = 'thumb-name';
    nameEl.textContent = name;
    nameEl.title = name;
    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'restore-btn';
    restoreBtn.textContent = 'Restore';
    restoreBtn.onclick = () => unflagImage(name);
    cell.append(img, nameEl, restoreBtn);
    grid.appendChild(cell);
  });
}

document.getElementById('panel-a').addEventListener('click', () => {
  const a = document.getElementById('panel-a').dataset.name;
  const b = document.getElementById('panel-b').dataset.name;
  if (a && b) onPick(a, b);
});

document.getElementById('panel-b').addEventListener('click', () => {
  const a = document.getElementById('panel-a').dataset.name;
  const b = document.getElementById('panel-b').dataset.name;
  if (a && b) onPick(b, a);
});

document.getElementById('flag-a').addEventListener('click', e => {
  e.stopPropagation();
  const a = document.getElementById('panel-a').dataset.name;
  if (a) flagImage(a);
});

document.getElementById('flag-b').addEventListener('click', e => {
  e.stopPropagation();
  const b = document.getElementById('panel-b').dataset.name;
  if (b) flagImage(b);
});

document.getElementById('removed-toggle-btn').addEventListener('click', () => {
  if (document.getElementById('removed-view').style.display === 'none') {
    removedPage = 0;
    showRemovedView();
  } else {
    startRating();
  }
});

document.getElementById('removed-prev-btn').addEventListener('click', () => {
  removedPage = Math.max(0, removedPage - 1);
  renderRemovedGrid();
});

document.getElementById('removed-next-btn').addEventListener('click', () => {
  removedPage++;
  renderRemovedGrid();
});

document.getElementById('switch-folder-btn').addEventListener('click', () => {
  showLoadingView(appData);
});

document.addEventListener('keydown', e => {
  if (document.getElementById('rating-view').style.display === 'none') return;
  const a = document.getElementById('panel-a').dataset.name;
  const b = document.getElementById('panel-b').dataset.name;
  if (!a || !b) return;
  if (e.key === 'ArrowLeft')  onPick(a, b);
  if (e.key === 'ArrowRight') onPick(b, a);
});

document.getElementById('results-toggle-btn').addEventListener('click', () => {
  if (document.getElementById('results-view').style.display === 'none') {
    resultsPage = 0;
    showResultsView();
  } else {
    showRatingView(
      document.getElementById('panel-a').dataset.name,
      document.getElementById('panel-b').dataset.name
    );
  }
});

document.getElementById('results-jump-top-btn').addEventListener('click', () => {
  resultsPage = 0;
  renderResultsGrid();
});

document.getElementById('results-jump-bottom-btn').addEventListener('click', () => {
  resultsPage = Infinity; // clamped to the last page inside renderResultsGrid
  renderResultsGrid();
});

document.getElementById('results-prev-btn').addEventListener('click', () => {
  resultsPage = Math.max(0, resultsPage - 1);
  renderResultsGrid();
});

document.getElementById('results-next-btn').addEventListener('click', () => {
  resultsPage++;
  renderResultsGrid();
});

function exportCSV() {
  const rows = Object.entries(appData.images)
    .filter(([, img]) => img.games > 0 || img.url)
    .sort((a, b) => b[1].score - a[1].score)
    .map(([name, img]) =>
      [name, img.score.toFixed(2), img.wins, img.losses, img.games].join(',')
    );
  const csv = ['filename,score,wins,losses,games', ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'elo-rankings.csv';

  URL.revokeObjectURL(url);
}
